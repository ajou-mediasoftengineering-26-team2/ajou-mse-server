    #     # java -jar 로 .jar 파일 실행.
    #     #   -> nohup으로 CI/CD가 끝나 SSH 연결을 끊어도 계속 실행되게하고
    #     #   -> ./output.log 2>&1 으로 stderr를 stdout으로 옮기고
    #     #   -> & 으로 백그라운드에서 실행되게 설정
